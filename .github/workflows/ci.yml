name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm run test:unit

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run integration tests
      run: npm run test:integration

  test-system:
    name: System Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run system tests
      run: npm run test:system

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

  validate:
    name: Full Validation
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-system, lint]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run all tests
      run: npm test

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-system, lint]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Generate test report
      run: |
        echo "Test Summary Report" > test-report.md
        echo "==================" >> test-report.md
        echo "" >> test-report.md
        echo "## Test Results" >> test-report.md
        echo "" >> test-report.md
        echo "- **Unit Tests**: Run with "`npm run test:unit`" >> test-report.md
        echo "- **Integration Tests**: Run with "`npm run test:integration`" >> test-report.md
        echo "- **System Tests**: Run with "`npm run test:system`" >> test-report.md
        echo "- **All Tests**: Run with "`npm test`" >> test-report.md
        echo "- **Linting**: Run with "`npm run lint`" >> test-report.md
        echo "" >> test-report.md
        echo "## CI/CD Status" >> test-report.md
        echo "" >> test-report.md
        echo "All test jobs must pass for deployment to proceed." >> test-report.md
        cat test-report.md
